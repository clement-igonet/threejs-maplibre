<!DOCTYPE html>
<html lang="en">
	<head>
		<title>threejs-maplibre - standalone script</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<style>
			body { margin: 0; background: #10161a; overflow: hidden; }
			#info, #version { position: absolute; left: 8px; z-index: 10; color: #cdd6dd; font: 12px/1.5 monospace; pointer-events: none; background: rgba(16, 22, 26, 0.6); padding: 2px 6px; border-radius: 3px; }
			#info { top: 8px; }
			#version { bottom: 8px; }
		</style>
	</head>
	<body>
		<div id="info">threejs-maplibre - standalone</div>
		<div id="version"></div>

		<!-- The built library, nothing else: no bundler, no sources, no import
		     map. build/threejs-maplibre.js comes from `npm run build` (or
		     `compose run --rm build`); a release serves the same file from
		     https://cdn.jsdelivr.net/npm/threejs-maplibre/build/threejs-maplibre.js -->
		<script src="../build/threejs-maplibre.js"></script>
		<script>

			const { THREE, AttributionControl, MapControls, Style, VectorTileMap, VectorTileSource, VERSION } = threejsMaplibre;

			const params = new URLSearchParams( location.search );
			const num = ( name, fallback ) => params.has( name ) ? parseFloat( params.get( name ) ) : fallback;
			const mode = params.get( 'mode' ) === 'planar' ? 'planar' : 'globe';

			async function main() {

				// any MapLibre style with a vector source: OpenFreeMap's Liberty by default
				const style = await Style.load( params.get( 'style' ) ?? 'https://tiles.openfreemap.org/styles/liberty' );
				const sourceId = Object.keys( style.sources )[ 0 ];
				const source = await VectorTileSource.loadTileJSON( style.sources[ sourceId ].url );

				const renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.outputColorSpace = THREE.SRGBColorSpace;
				document.body.appendChild( renderer.domElement );

				const scene = new THREE.Scene();
				const [ r, g, b ] = style.backgroundLayer.get( 'background-color', 14 ).rgb;
				scene.background = new THREE.Color().setRGB( r, g, b, THREE.SRGBColorSpace );
				scene.add( new THREE.HemisphereLight( 0xffffff, 0x8a8478, 1.0 ) );
				const sun = new THREE.DirectionalLight( 0xffffff, 2.0 );
				sun.position.set( 1, 2, 1 ); // set per frame below
				scene.add( sun, sun.target );

				const camera = new THREE.PerspectiveCamera( 60, window.innerWidth / window.innerHeight, 1, 1e8 );
				const controls = new MapControls( camera, renderer.domElement, { mode } );
				controls.minAltitude = 20;
				controls.setView( { lat: num( 'lat', 48.8606 ), lon: num( 'lon', 2.3376 ), distance: num( 'alt', 900 ), heading: num( 'heading', 20 ), pitch: num( 'pitch', 50 ) } );

				const map = new VectorTileMap( source, style, { mode, sourceId } );
				scene.add( map );
				new AttributionControl( document.body ).addSource( source );

				window.addEventListener( 'resize', () => {

					camera.aspect = window.innerWidth / window.innerHeight;
					camera.updateProjectionMatrix();
					renderer.setSize( window.innerWidth, window.innerHeight );

				} );

				document.getElementById( 'version' ).textContent = `threejs-maplibre v${ VERSION } (standalone build)`;
				const info = document.getElementById( 'info' );
				const target = new THREE.Vector3(), up = new THREE.Vector3(), back = new THREE.Vector3(), right = new THREE.Vector3();
				let last = performance.now();
				let stableFrames = 0;

				renderer.setAnimationLoop( () => {

					const now = performance.now();
					const delta = now - last;
					last = now;
					controls.update();

					// the sun over the view center, behind the camera's right shoulder
					controls.getTarget( target, up );
					back.subVectors( camera.position, target ).projectOnPlane( up ).normalize();
					right.crossVectors( back, up ).normalize();
					sun.target.position.copy( target );
					sun.position.copy( target ).addScaledVector( up, 3000 ).addScaledVector( back, 1200 ).addScaledVector( right, 1800 );

					map.update( camera, renderer, delta );
					renderer.render( scene, camera );

					const s = map.stats;
					info.textContent = `threejs-maplibre standalone - ${ mode } | zoom ${ map.zoom.toFixed( 2 ) } | heading ${ controls.heading.toFixed( 0 ) }° | pitch ${ controls.pitch.toFixed( 0 ) }° | rendered ${ s.rendered } | loading ${ s.loading } | draw calls ${ renderer.info.render.calls } | triangles ${ renderer.info.render.triangles }`;

					// the screenshot script waits for a settled view
					stableFrames = s.loading === 0 && s.rendered >= s.selected ? stableFrames + 1 : 0;
					if ( stableFrames === 30 ) window.__SHOT_READY = true;

				} );

				window.__CONTROLS = controls;

			}

			main().catch( error => {

				document.getElementById( 'info' ).textContent = `threejs-maplibre standalone - ${ error.message }`;
				throw error;

			} );

		</script>
	</body>
</html>
