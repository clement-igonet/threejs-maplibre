<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>threejs-maplibre bridge: MapLibre under a three.js scene</title>
		<style>
			html, body { margin: 0; height: 100%; overflow: hidden; }
			#basemap, #scene { position: absolute; inset: 0; }
			#scene { pointer-events: auto; }
			#basemap { pointer-events: none; }
			#info { position: absolute; top: 8px; left: 8px; padding: 6px 10px; font: 13px/1.4 ui-monospace, monospace; color: #fff; background: rgba(0, 0, 0, 0.6); border-radius: 4px; white-space: pre; pointer-events: none; }
			#version { position: absolute; bottom: 8px; left: 8px; padding: 4px 8px; font: 12px ui-monospace, monospace; color: #fff; background: rgba(0, 0, 0, 0.6); border-radius: 4px; }
		</style>
	</head>
	<body>
		<div id="basemap"></div>
		<div id="scene"></div>
		<div id="info"></div>
		<div id="version"></div>
		<script type="module">

			// Direction B: a maplibre-gl map under this library's scene, one
			// controller driving both. MapLibre's whole style shows through,
			// labels included, under the antenna and the pin of the objects
			// demo; ?buildings=1 draws this engine's extruded buildings on top
			// of it too (and over MapLibre's labels, since two canvases share
			// no depth buffer: that is what the layer, direction A, is for).
			// On ?projection=globe the scene is this engine's globe built on
			// MapLibre's sphere, under MapLibre's globe.
			//
			//   ?projection=mercator|globe   ?style=<url>
			//   ?lat=&lon=&alt=&heading=&pitch=&fov=
			//   ?data=louvre|openfreemap for the buildings' tiles

			import { Color, DirectionalLight, HemisphereLight, PerspectiveCamera, Scene, SRGBColorSpace, Vector3, WebGLRenderer, Group, Mesh, MeshStandardMaterial, ConeGeometry, CylinderGeometry, DoubleSide, LatheGeometry, SphereGeometry, Vector2 } from 'three';
			import { MAPLIBRE_FOV, MAPLIBRE_SPHERE, MapAnchor, MapControls, MapLibreUnderlay, Style, VectorTileMap } from '../src/index.js';
			import { loadVectorData } from './vector-data.js';

			const maplibregl = await import( 'maplibre-gl' );
			await import( 'maplibre-gl/dist/maplibre-gl.css' );
			maplibregl.setWorkerUrl( ( await import( 'maplibre-gl/dist/maplibre-gl-worker.mjs?worker&url' ) ).default );

			const params = new URLSearchParams( location.search );
			const num = ( name, fallback ) => params.has( name ) ? parseFloat( params.get( name ) ) : fallback;
			const projection = params.get( 'projection' ) === 'globe' ? 'globe' : 'mercator';
			const mode = projection === 'globe' ? 'globe' : 'planar';
			const datum = MAPLIBRE_SPHERE; // the scene stands on MapLibre's earth
			const ANTENNA = { lat: 48.8613, lon: 2.3323 };
			const PYRAMID = { lat: 48.86107, lon: 2.33590 };

			// the basemap, driven from here: no handlers of its own
			const map = new maplibregl.Map( {
				container: 'basemap',
				style: params.get( 'style' ) ?? 'https://tiles.openfreemap.org/styles/liberty',
				center: [ 2.3342, 48.8615 ],
				zoom: 16,
				interactive: false,
				projection: { type: projection },
				attributionControl: { compact: false },
			} );
			await new Promise( resolve => map.once( 'load', resolve ) );
			map.setProjection( { type: projection } );
			const underlay = new MapLibreUnderlay( map, { mode, datum } );

			// the scene, on a transparent canvas over it
			const renderer = new WebGLRenderer( { antialias: true, alpha: true } );
			renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.setClearColor( 0x000000, 0 );
			renderer.outputColorSpace = SRGBColorSpace;
			document.getElementById( 'scene' ).appendChild( renderer.domElement );

			const scene = new Scene();
			const camera = new PerspectiveCamera( num( 'fov', MAPLIBRE_FOV ), window.innerWidth / window.innerHeight, 1, 1e8 );
			const controls = new MapControls( camera, renderer.domElement, { mode, datum } );
			controls.minAltitude = 20;
			controls.setView( { lat: num( 'lat', 48.8615 ), lon: num( 'lon', 2.3342 ), distance: num( 'alt', 520 ), heading: num( 'heading', 70 ), pitch: num( 'pitch', 60 ) } );

			scene.add( new HemisphereLight( 0xffffff, 0x8a8478, 1.0 ) );
			const sun = new DirectionalLight( 0xffffff, 2.0 );
			sun.position.set( 300, 600, 200 );
			scene.add( sun );

			let buildings = null;
			if ( params.get( 'buildings' ) === '1' ) {

				// this engine's extrusions only: the basemap draws the rest
				const { source, style, sourceId } = await loadVectorData( params );
				const extrusions = new Style( { ...style.json, layers: style.json.layers.filter( l => l.type === 'fill-extrusion' ) } );
				buildings = new VectorTileMap( source, extrusions, { mode, datum, sourceId } );
				scene.add( buildings );

			}

			function createAntenna() {

				const white = new MeshStandardMaterial( { color: 0xe6e6e2, roughness: 0.6, metalness: 0.1 } );
				const grey = new MeshStandardMaterial( { color: 0x8f959a, roughness: 0.5, metalness: 0.4 } );
				const antenna = new Group();
				const pedestal = new Mesh( new CylinderGeometry( 4, 5.5, 12, 24 ), grey );
				pedestal.position.y = 6;
				const tower = new Mesh( new CylinderGeometry( 1.6, 2.6, 10, 16 ), white );
				tower.position.y = 17;
				antenna.add( pedestal, tower );
				const mount = new Group();
				mount.position.y = 22;
				const dish = new Group();
				dish.rotation.x = - 0.9;
				mount.add( dish );
				antenna.add( mount );
				const profile = [];
				for ( let i = 0; i <= 24; i ++ ) profile.push( new Vector2( 17 * i / 24, ( 17 * i / 24 ) ** 2 / 48 ) );
				dish.add( new Mesh( new LatheGeometry( profile, 48 ), new MeshStandardMaterial( { color: 0xf0f0ec, roughness: 0.4, metalness: 0.2, side: DoubleSide } ) ) );
				const feed = new Mesh( new CylinderGeometry( 0.4, 0.4, 12, 8 ), grey );
				feed.position.y = 6;
				const horn = new Mesh( new ConeGeometry( 1.2, 2, 12 ), grey );
				horn.position.y = 12;
				horn.rotation.x = Math.PI;
				dish.add( feed, horn );
				antenna.mount = mount;
				return antenna;

			}

			function createPin( color ) {

				const pin = new Group();
				const material = new MeshStandardMaterial( { color, roughness: 0.5 } );
				const needle = new Mesh( new ConeGeometry( 3, 12, 16 ), material );
				needle.position.y = 6;
				needle.rotation.x = Math.PI;
				const head = new Mesh( new SphereGeometry( 5, 24, 16 ), material );
				head.position.y = 15;
				pin.add( needle, head );
				return pin;

			}

			const antenna = createAntenna();
			scene.add( new MapAnchor( { mode, datum } ).setLocation( ANTENNA.lat, ANTENNA.lon, 0, 250 ).add( antenna ) );
			scene.add( new MapAnchor( { mode, datum } ).setLocation( PYRAMID.lat, PYRAMID.lon, 40 ).add( createPin( 0xe03030 ) ) );

			// alignment: a ground point through this camera against map.project
			const _p = new Vector3();
			window.__align = places => places.map( ( [ lat, lon ] ) => {

				const anchor = new MapAnchor( { mode, datum } ).setLocation( lat, lon, 0 );
				_p.copy( anchor.position ).project( camera );
				const ours = [ ( _p.x * 0.5 + 0.5 ) * window.innerWidth, ( 0.5 - _p.y * 0.5 ) * window.innerHeight ];
				const theirs = map.project( [ lon, lat ] );
				return { ours, theirs: [ theirs.x, theirs.y ], px: Math.hypot( ours[ 0 ] - theirs.x, ours[ 1 ] - theirs.y ) };

			} );
			window.__setView = view => { controls.setView( view ); controls.update(); underlay.sync( camera ); map.triggerRepaint(); };

			const info = document.getElementById( 'info' );
			const t0 = performance.now();
			let frames = 0, frameMs = 0, last = performance.now();
			function frame() {

				const now = performance.now();
				frameMs += now - last; last = now; frames ++;
				controls.update();
				const synced = underlay.sync( camera );
				antenna.mount.rotation.y = 0.4 * Math.sin( ( now - t0 ) / 3000 );
				if ( buildings ) buildings.update( camera, renderer );
				renderer.render( scene, camera );
				const state = underlay._last;
				info.textContent = `threejs-maplibre bridge, underlay: ${ projection } | maplibre-gl ${ maplibregl.getVersion() } under three.js | zoom ${ state.zoom?.toFixed( 2 ) } | pitch ${ Math.round( controls.pitch ) }° | heading ${ Math.round( controls.heading ) }° | map ${ synced ? 'following' : 'sees no ground' }${ buildings ? ` | buildings: ${ buildings.stats.rendered } tiles, ${ renderer.info.render.calls } draws` : '' } | ${ ( frameMs / frames ).toFixed( 1 ) } ms/frame`;
				window.__SHOT_READY = map.loaded() && ( ! buildings || ( buildings.stats.loading === 0 && buildings.stats.rendered > 0 ) );
				requestAnimationFrame( frame );

			}

			frame();

			window.addEventListener( 'resize', () => {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize( window.innerWidth, window.innerHeight );
				map.resize();

			} );

			document.getElementById( 'version' ).textContent = `threejs-maplibre v${ __VERSION__ } (${ __BUILD__ })`;
			window.__MAP = map;
			window.__CONTROLS = controls;

		</script>
	</body>
</html>
