<!DOCTYPE html>
<html lang="en">
	<head>
		<title>threejs-maplibre - OSM globe</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<style>
			body { margin: 0; background: #10161a; overflow: hidden; }
			#info { position: absolute; top: 8px; left: 8px; z-index: 10; color: #cdd6dd; font: 12px/1.5 monospace; pointer-events: none; }
		</style>
	</head>
	<body>
		<div id="info">threejs-maplibre M1 - globe mode</div>
		<script type="module">

			import { PerspectiveCamera, Scene, TOUCH, WebGLRenderer } from 'three';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { AttributionControl, RasterTileMap, WGS84_RADIUS, WGS84_RADIUS_POLAR, createOSMSource, geocentricHeight, latLonToEcef, updateGlobeOrbitSpeeds } from '../src/index.js';
			import { createStubSource } from './stub-tiles.js';

			const params = new URLSearchParams( location.search );
			const source = params.get( 'tiles' ) === 'stub' ? createStubSource() : createOSMSource();

			const renderer = new WebGLRenderer( { antialias: true } );
			renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( window.innerWidth, window.innerHeight );
			document.body.appendChild( renderer.domElement );

			const scene = new Scene();
			const camera = new PerspectiveCamera( 60, window.innerWidth / window.innerHeight, 10, 1e8 );

			// ?lat=&lon=&alt= (meters) starts above a place; default is the whole earth
			if ( params.has( 'lat' ) ) {

				latLonToEcef( parseFloat( params.get( 'lat' ) ), parseFloat( params.get( 'lon' ) || '0' ), parseFloat( params.get( 'alt' ) || '5000' ), camera.position );

			} else {

				camera.position.set( 2.5 * WGS84_RADIUS, 1.2 * WGS84_RADIUS, 1.5 * WGS84_RADIUS );

			}

			const map = new RasterTileMap( source, { mode: 'globe' } );
			scene.add( map );

			const attribution = new AttributionControl( document.body );
			attribution.addSource( source );

			// orbit around the globe center; panning would move the target off it
			const controls = new OrbitControls( camera, renderer.domElement );
			controls.enableDamping = true;
			controls.enablePan = false;
			controls.touches.TWO = TOUCH.DOLLY_ROTATE; // pinch zooms while the two fingers also drag the ground
			controls.minDistance = WGS84_RADIUS_POLAR; // the real floor is MIN_ALTITUDE below
			controls.maxDistance = 10 * WGS84_RADIUS;
			const MIN_ALTITUDE = 200;

			const info = document.getElementById( 'info' );
			const formatAltitude = m => m >= 10000 ? `${ Math.round( m / 1000 ) } km` : `${ Math.round( m ) } m`;
			let last = performance.now();
			let stableFrames = 0;

			renderer.setAnimationLoop( () => {

				const now = performance.now();
				const delta = now - last;
				last = now;

				// drag and zoom sensitivity follow the altitude
				updateGlobeOrbitSpeeds( controls, camera );
				controls.update();

				// keep the camera above the ellipsoid, whatever the latitude
				const altitude = geocentricHeight( camera.position );
				if ( altitude < MIN_ALTITUDE ) camera.position.multiplyScalar( 1 + ( MIN_ALTITUDE - altitude ) / camera.position.length() );
				map.update( camera, renderer, delta );
				renderer.render( scene, camera );

				window.__CAMERA = camera; // for the control e2e check
				const s = map.stats;
				info.textContent = `threejs-maplibre M1 - globe | alt ${ formatAltitude( altitude ) } | selected ${ s.selected } | rendered ${ s.rendered } | loading ${ s.loading } | culled ${ s.culled }`;

				// screenshot harness: flag once the frame content is stable
				stableFrames = ( s.loading === 0 && s.rendered > 0 && s.rendered >= s.selected ) ? stableFrames + 1 : 0;
				window.__SHOT_READY = stableFrames > 30;

			} );

			window.addEventListener( 'resize', () => {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize( window.innerWidth, window.innerHeight );

			} );

		</script>
	</body>
</html>
