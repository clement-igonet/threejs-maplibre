<!DOCTYPE html>
<html lang="en">
	<head>
		<title>threejs-maplibre - OSM globe</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<style>
			body { margin: 0; background: #10161a; overflow: hidden; }
			#info, #version { position: absolute; left: 8px; z-index: 10; color: #cdd6dd; font: 12px/1.5 monospace; pointer-events: none; background: rgba(16, 22, 26, 0.6); padding: 2px 6px; border-radius: 3px; }
			#info { top: 8px; }
			#version { bottom: 8px; }
		</style>
	</head>
	<body>
		<div id="info">threejs-maplibre M1 - globe mode</div>
		<div id="version"></div>
		<script type="module">

			import { PerspectiveCamera, Scene, WebGLRenderer } from 'three';
			import { AttributionControl, MapControls, RasterTileMap, createOSMSource, geocentricHeight } from '../src/index.js';
			import { createStubSource } from './stub-tiles.js';

			const params = new URLSearchParams( location.search );
			const source = params.get( 'tiles' ) === 'stub' ? createStubSource() : createOSMSource();

			const renderer = new WebGLRenderer( { antialias: true } );
			renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( window.innerWidth, window.innerHeight );
			document.body.appendChild( renderer.domElement );

			const scene = new Scene();
			const camera = new PerspectiveCamera( 60, window.innerWidth / window.innerHeight, 10, 1e8 );

			// map-style controls: drag pans, wheel or pinch zooms, right drag
			// (or two fingers sliding together) tilts and turns
			const controls = new MapControls( camera, renderer.domElement, { mode: 'globe' } );
			controls.minAltitude = 200;

			// ?lat=&lon=&alt=&heading=&pitch= starts above a place; default is the whole earth
			const num = ( name, fallback ) => params.has( name ) ? parseFloat( params.get( name ) ) : fallback;
			if ( params.has( 'lat' ) ) {

				controls.setView( { lat: num( 'lat', 0 ), lon: num( 'lon', 0 ), distance: num( 'alt', 5000 ), heading: num( 'heading', 0 ), pitch: num( 'pitch', 0 ) } );

			} else {

				controls.setView( { lat: 30, lon: 10, distance: 2e7 } );

			}

			const map = new RasterTileMap( source, { mode: 'globe' } );
			scene.add( map );

			const attribution = new AttributionControl( document.body );
			attribution.addSource( source );

			document.getElementById( 'version' ).textContent = `threejs-maplibre v${ __VERSION__ } (${ __BUILD__ })`;
			const info = document.getElementById( 'info' );
			const formatAltitude = m => m >= 10000 ? `${ Math.round( m / 1000 ) } km` : `${ Math.round( m ) } m`;
			let last = performance.now();
			let stableFrames = 0;

			renderer.setAnimationLoop( () => {

				const now = performance.now();
				const delta = now - last;
				last = now;

				controls.update();
				map.update( camera, renderer, delta );
				renderer.render( scene, camera );

				window.__CAMERA = camera; // for the control e2e check
				window.__CONTROLS = controls;
				const altitude = geocentricHeight( camera.position );
				window.__ALTITUDE = altitude;
				const s = map.stats;
				info.textContent = `threejs-maplibre M1 - globe | alt ${ formatAltitude( altitude ) } | heading ${ Math.round( controls.heading ) }° | pitch ${ Math.round( controls.pitch ) }° | selected ${ s.selected } | rendered ${ s.rendered } | loading ${ s.loading } | culled ${ s.culled }`;

				// screenshot harness: flag once the frame content is stable
				stableFrames = ( s.loading === 0 && s.rendered > 0 && s.rendered >= s.selected ) ? stableFrames + 1 : 0;
				window.__SHOT_READY = stableFrames > 30;

			} );

			window.addEventListener( 'resize', () => {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize( window.innerWidth, window.innerHeight );

			} );

		</script>
	</body>
</html>
