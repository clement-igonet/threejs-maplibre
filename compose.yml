# Zero-install workflow (docker compose or podman compose), nothing but the
# container runtime on the host:
#   compose run --rm build  -> the library in ./build (threejs-maplibre.module.js, threejs-maplibre.js)
#   compose up dev          -> demos from the sources on http://localhost:5173/demo/
#   compose up preview      -> the built site (library + demos, as deployed) on http://localhost:4173/
#   compose run --rm test   -> unit tests
#   compose run --rm screenshot -> deterministic demo screenshots in ./screenshots
#   compose run --rm bench  -> raster engine benchmark vs 3d-tiles-renderer, table on stdout + bench/results.json
#   compose run --rm bench-vector -> vector engine benchmark vs maplibre-gl-js, table on stdout + bench/vector-results-<data>-<mode>.json
#                              (BENCH_DATA=openfreemap for the live Liberty style, BENCH_MODE=planar for the flat map)
#   compose run --rm budget -> the CI performance budget on the Louvre extract, fails when a number is over bench/budget.json
#                              (BUDGET_UPDATE=1 records this run as the new ceilings)
services:
  build:
    image: docker.io/library/node:22-bookworm
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - PUPPETEER_SKIP_DOWNLOAD=1
    command: bash -lc "[ -d node_modules ] || npm install --no-audit --no-fund; npm run build && ls -l build"

  preview:
    image: docker.io/library/node:22-bookworm
    ports:
      - "4173:4173"
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - PUPPETEER_SKIP_DOWNLOAD=1
    command: bash -lc "[ -d node_modules ] || npm install --no-audit --no-fund; npm run build && npm run build:site && npx vite preview --host 0.0.0.0 --port 4173"

  dev:
    image: docker.io/library/node:22-bookworm
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - PUPPETEER_SKIP_DOWNLOAD=1
    command: bash -lc "[ -d node_modules ] || npm install --no-audit --no-fund; npx vite --host 0.0.0.0 --port 5173"

  test:
    image: docker.io/library/node:22-bookworm
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - PUPPETEER_SKIP_DOWNLOAD=1
    command: bash -lc "[ -d node_modules ] || npm install --no-audit --no-fund; npx vitest run"

  screenshot:
    image: ghcr.io/puppeteer/puppeteer:latest
    user: root
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - PUPPETEER_SKIP_DOWNLOAD=1
      - PUPPETEER_CACHE_DIR=/home/pptruser/.cache/puppeteer
    command: bash -lc "[ -d node_modules ] || npm install --no-audit --no-fund; npm run screenshot"

  bench:
    image: ghcr.io/puppeteer/puppeteer:latest
    user: root
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - PUPPETEER_SKIP_DOWNLOAD=1
      - PUPPETEER_CACHE_DIR=/home/pptruser/.cache/puppeteer
    command: bash -lc "[ -d node_modules ] || npm install --no-audit --no-fund; npm run bench"

  bench-vector:
    image: ghcr.io/puppeteer/puppeteer:latest
    user: root
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - PUPPETEER_SKIP_DOWNLOAD=1
      - PUPPETEER_CACHE_DIR=/home/pptruser/.cache/puppeteer
      - BENCH_DATA
      - BENCH_MODE
    command: bash -lc "[ -d node_modules ] || npm install --no-audit --no-fund; npm run bench:vector"

  budget:
    image: ghcr.io/puppeteer/puppeteer:latest
    user: root
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - PUPPETEER_SKIP_DOWNLOAD=1
      - PUPPETEER_CACHE_DIR=/home/pptruser/.cache/puppeteer
      - BENCH_MODE
      - BUDGET_UPDATE
    command: bash -lc "[ -d node_modules ] || npm install --no-audit --no-fund; npm run budget"
