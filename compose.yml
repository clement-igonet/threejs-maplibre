# Zero-install workflow (docker compose or podman compose):
#   compose up dev          -> demos on http://localhost:5173/demo/
#   compose run --rm test   -> unit tests
#   compose run --rm screenshot -> deterministic demo screenshots in ./screenshots
#   compose run --rm bench  -> engine benchmark vs 3d-tiles-renderer, table on stdout + bench/results.json
services:
  dev:
    image: docker.io/library/node:22-bookworm
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - PUPPETEER_SKIP_DOWNLOAD=1
    command: bash -lc "[ -d node_modules ] || npm install --no-audit --no-fund; npx vite --host 0.0.0.0 --port 5173"

  test:
    image: docker.io/library/node:22-bookworm
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - PUPPETEER_SKIP_DOWNLOAD=1
    command: bash -lc "[ -d node_modules ] || npm install --no-audit --no-fund; npx vitest run"

  screenshot:
    image: ghcr.io/puppeteer/puppeteer:latest
    user: root
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - PUPPETEER_SKIP_DOWNLOAD=1
      - PUPPETEER_CACHE_DIR=/home/pptruser/.cache/puppeteer
    command: bash -lc "[ -d node_modules ] || npm install --no-audit --no-fund; npm run screenshot"

  bench:
    image: ghcr.io/puppeteer/puppeteer:latest
    user: root
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - PUPPETEER_SKIP_DOWNLOAD=1
      - PUPPETEER_CACHE_DIR=/home/pptruser/.cache/puppeteer
    command: bash -lc "[ -d node_modules ] || npm install --no-audit --no-fund; npm run bench"
