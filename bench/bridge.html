<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>threejs-maplibre bridge alignment</title>
		<style>
			html, body { margin: 0; height: 100%; }
			#map { width: 800px; height: 500px; }
		</style>
	</head>
	<body>
		<div id="map"></div>
		<script type="module">

			// Where a three.js scene drawn through MapLibreLayer lands, against
			// where maplibre-gl itself puts the same ground: for a set of poses
			// (zoom, pitch, bearing) it projects points around the anchor both
			// ways and reports the worst distance in pixels. The ground truth is
			// map.project(), MapLibre's own answer, not a formula of ours.
			//
			//   ?projection=globe|mercator
			//
			// scripts/bridge-check.mjs drives it and prints the table.

			import { AmbientLight, BoxGeometry, DirectionalLight, DoubleSide, EdgesGeometry, LineBasicMaterial, LineSegments, Mesh, MeshBasicMaterial, MeshLambertMaterial, PlaneGeometry, Vector4 } from 'three';
			import { MapLibreLayer } from '../src/bridge/MapLibreLayer.js';
			import { MAPLIBRE_EARTH_RADIUS } from '../src/bridge/MapLibreFrames.js';

			const params = new URLSearchParams( location.search );
			const projection = params.get( 'projection' ) === 'mercator' ? 'mercator' : 'globe';
			// ?boxes=1: a MapLibre fill-extrusion and a three.js box of the same
			// size in the same place, to see height and face winding line up
			const boxes = params.get( 'boxes' ) === '1' || params.get( 'silhouette' ) === '1';
			// ?silhouette=1: opaque, unlit, one colour per engine, for masks
			const silhouette = params.get( 'silhouette' ) === '1';

			const maplibregl = await import( 'maplibre-gl' );
			await import( 'maplibre-gl/dist/maplibre-gl.css' );
			maplibregl.setWorkerUrl( ( await import( 'maplibre-gl/dist/maplibre-gl-worker.mjs?url' ) ).default );

			// the Louvre pyramid, the reference scene, unless ?lng=&lat= say otherwise
			const LNG = params.has( 'lng' ) ? parseFloat( params.get( 'lng' ) ) : 2.3359;
			const LAT = params.has( 'lat' ) ? parseFloat( params.get( 'lat' ) ) : 48.8610;

			const map = new maplibregl.Map( {
				container: 'map',
				style: {
					version: 8,
					sources: {},
					layers: [ { id: 'background', type: 'background', paint: { 'background-color': '#eeeeee' } } ],
					projection: { type: projection },
				},
				center: [ LNG, LAT ],
				zoom: 14,
				pixelRatio: 1,
				maxPitch: 85,
				// read back for the silhouette comparison
				canvasContextAttributes: { preserveDrawingBuffer: true, antialias: false },
				fadeDuration: 0,
				attributionControl: false,
			} );
			await new Promise( resolve => map.once( 'load', resolve ) );

			const layer = new MapLibreLayer( { lng: LNG, lat: LAT } );

			if ( boxes ) {

				// two sizes: one to see from the globe zooms, one for the street
				// apart, so a street-level camera is not standing inside the big one
				const BOXES = [ { east: 0, size: 3000, height: 1500 }, { east: 2500, size: 60, height: 50 } ];
				// ?height= flattens both, to tell a ground offset from a height one
				if ( params.has( 'height' ) ) for ( const box of BOXES ) box.height = parseFloat( params.get( 'height' ) );
				const features = BOXES.map( ( { east, size, height } ) => {

					const h = size / 2;
					const ring = [ [ - h, - h ], [ h, - h ], [ h, h ], [ - h, h ], [ - h, - h ] ].map( ( [ e, n ] ) => offsetLngLat( east + e, n ) );
					return { type: 'Feature', properties: { height }, geometry: { type: 'Polygon', coordinates: [ ring ] } };

				} );
				map.addSource( 'boxes', { type: 'geojson', data: { type: 'FeatureCollection', features } } );
				// ?flat=1: a plain fill on the ground instead, against a flat square
				const flat = params.get( 'flat' ) === '1';
				map.addLayer( flat
					? { id: 'maplibre-boxes', type: 'fill', source: 'boxes', paint: { 'fill-color': '#2244ff' } }
					: {
						id: 'maplibre-boxes', type: 'fill-extrusion', source: 'boxes',
						paint: { 'fill-extrusion-color': '#2244ff', 'fill-extrusion-height': [ 'get', 'height' ], 'fill-extrusion-opacity': silhouette ? 1 : 0.6 },
					} );

				for ( const { east, size, height } of BOXES ) {

					if ( silhouette ) {

						// the same box MapLibre extrudes, unlit, one-sided; flat, a
						// square lying on the ground seen from both sides
						const box = params.get( 'flat' ) === '1'
							? new Mesh( new PlaneGeometry( size, size ).rotateX( - Math.PI / 2 ), new MeshBasicMaterial( { color: 0xff0000, side: DoubleSide } ) )
							: new Mesh( new BoxGeometry( size, height, size ), new MeshBasicMaterial( { color: 0xff0000 } ) );
						box.position.set( east, params.get( 'flat' ) === '1' ? 0 : height / 2, 0 );
						layer.scene.add( box );
						continue;

					}

					// lit and one-sided: a box drawn inside out would show it
					const box = new Mesh( new BoxGeometry( size * 0.5, height, size * 0.5 ), new MeshLambertMaterial( { color: 0xff5533 } ) );
					box.position.set( east, height / 2, 0 );
					const edges = new LineSegments( new EdgesGeometry( new BoxGeometry( size, height, size ) ), new LineBasicMaterial( { color: 0xff0000 } ) );
					edges.position.set( east, height / 2, 0 );
					layer.scene.add( box, edges );

				}

				layer.scene.add( new AmbientLight( 0xffffff, 0.6 ) );
				const sun = new DirectionalLight( 0xffffff, 2 );
				sun.position.set( 1, 2, 1.5 );
				layer.scene.add( sun );

			}

			map.addLayer( layer );

			// a point `east` and `north` meters from the anchor, on MapLibre's sphere
			function offsetLngLat( east, north ) {

				const dLat = north / MAPLIBRE_EARTH_RADIUS * 180 / Math.PI;
				const dLng = east / ( MAPLIBRE_EARTH_RADIUS * Math.cos( LAT * Math.PI / 180 ) ) * 180 / Math.PI;
				return [ LNG + dLng, LAT + dLat ];

			}

			const canvas = map.getCanvas();
			const _clip = new Vector4();

			// where the layer's matrix puts a local point, in CSS pixels
			function layerPixel( east, north ) {

				_clip.set( east, 0, - north, 1 ).applyMatrix4( layer.lastProjection.matrix );
				return [
					( _clip.x / _clip.w * 0.5 + 0.5 ) * canvas.clientWidth,
					( 0.5 - _clip.y / _clip.w * 0.5 ) * canvas.clientHeight,
				];

			}

			// wide: points out to a third of the view, which is where the globe
			// and mercator projections part ways in the blend band; the meters
			// frame drifts too out there (quadratically), so this measures both
			window.__align = async ( poses, { wide = false } = {} ) => {

				const rows = [];
				for ( const { zoom, pitch = 0, bearing = 0 } of poses ) {

					map.jumpTo( { center: [ LNG, LAT ], zoom, pitch, bearing } );
					await new Promise( resolve => map.once( 'render', resolve ) );
					map.triggerRepaint();
					await new Promise( resolve => map.once( 'render', resolve ) );

					// points spread over a third of the view, so they stay on screen
					// and inside the range where a meters frame is the map
					const span = map.getCanvas().clientWidth * 2 * Math.PI * MAPLIBRE_EARTH_RADIUS * Math.cos( LAT * Math.PI / 180 ) / ( 512 * 2 ** zoom );
					const d = wide ? span / 3 : Math.min( span / 6, 2000 );
					let worst = 0;
					for ( const [ e, n ] of [ [ 0, 0 ], [ d, 0 ], [ - d, 0 ], [ 0, d ], [ 0, - d ], [ d, d ], [ - d, - d ] ] ) {

						const truth = map.project( offsetLngLat( e, n ) );
						const [ x, y ] = layerPixel( e, n );
						worst = Math.max( worst, Math.hypot( x - truth.x, y - truth.y ) );

					}

					rows.push( { zoom, pitch, bearing, transition: + layer.lastProjection.transition.toFixed( 3 ), spreadMeters: Math.round( d ), worstPx: + worst.toFixed( 3 ) } );

				}

				return rows;

			};

			// for screenshots: a pose centred on a point east of the anchor
			window.__pose = async ( { zoom, pitch = 0, bearing = 0, east = 0 } ) => {

				map.jumpTo( { center: offsetLngLat( east, 0 ), zoom, pitch, bearing } );
				await new Promise( resolve => map.once( 'idle', resolve ) );
				return { transition: layer.lastProjection.transition };

			};

			// Which pixels one engine alone covers: blue for MapLibre's extrusion,
			// red for the three.js box. The two masks are compared by overlap.
			async function mask( which ) {

				map.setLayoutProperty( 'maplibre-boxes', 'visibility', which === 'maplibre' ? 'visible' : 'none' );
				layer.scene.visible = which === 'three';
				map.triggerRepaint();
				await new Promise( resolve => map.once( 'render', resolve ) );

				const w = canvas.width, h = canvas.height;
				const ctx = Object.assign( document.createElement( 'canvas' ), { width: w, height: h } ).getContext( '2d' );
				ctx.drawImage( canvas, 0, 0 );
				const px = ctx.getImageData( 0, 0, w, h ).data;
				const out = new Uint8Array( w * h );
				for ( let i = 0; i < w * h; i ++ ) {

					const r = px[ 4 * i ], g = px[ 4 * i + 1 ], b = px[ 4 * i + 2 ];
					out[ i ] = which === 'maplibre' ? ( b > r + 60 && b > g + 60 ? 1 : 0 ) : ( r > g + 60 && r > b + 60 ? 1 : 0 );

				}

				return out;

			}

			// the big box's footprint where map.project says it is, as a mask:
			// MapLibre's own answer, to hold its rendering against
			function projectedMask() {

				const w = canvas.width, h = canvas.height;
				const ctx = Object.assign( document.createElement( 'canvas' ), { width: w, height: h } ).getContext( '2d' );
				ctx.fillStyle = '#ff0000';
				ctx.beginPath();
				for ( const [ e, n ] of [ [ - 1500, - 1500 ], [ 1500, - 1500 ], [ 1500, 1500 ], [ - 1500, 1500 ] ] ) {

					// sampled along each edge, so a curved globe edge is followed
					const p = map.project( offsetLngLat( e, n ) );
					ctx.lineTo( p.x, p.y );

				}

				ctx.closePath();
				ctx.fill();
				const px = ctx.getImageData( 0, 0, w, h ).data;
				const out = new Uint8Array( w * h );
				for ( let i = 0; i < w * h; i ++ ) out[ i ] = px[ 4 * i ] > 128 ? 1 : 0;
				return out;

			}

			window.__silhouette = async ( pose, { against = 'three' } = {} ) => {

				const { transition } = await window.__pose( pose );
				const a = await mask( 'maplibre' );
				const b = against === 'project' ? projectedMask() : await mask( 'three' );
				let both = 0, either = 0, onlyA = 0, onlyB = 0;
				for ( let i = 0; i < a.length; i ++ ) {

					if ( a[ i ] && b[ i ] ) both ++;
					if ( a[ i ] || b[ i ] ) either ++;
					if ( a[ i ] && ! b[ i ] ) onlyA ++;
					if ( b[ i ] && ! a[ i ] ) onlyB ++;

				}

				// both masks in one picture: MapLibre alone blue, three.js alone red,
				// both purple, for looking at what a low overlap is made of
				const w = canvas.width, h = canvas.height;
				const view = Object.assign( document.createElement( 'canvas' ), { width: w, height: h } ).getContext( '2d' );
				const image = view.createImageData( w, h );
				for ( let i = 0; i < a.length; i ++ ) {

					const c = a[ i ] && b[ i ] ? [ 150, 60, 200 ] : a[ i ] ? [ 40, 80, 255 ] : b[ i ] ? [ 255, 40, 40 ] : [ 245, 245, 245 ];
					image.data.set( [ ...c, 255 ], 4 * i );

				}

				view.putImageData( image, 0, 0 );
				window.__overlay = view.canvas.toDataURL( 'image/png' );

				return { transition, maplibrePx: both + onlyA, threePx: both + onlyB, iou: + ( both / Math.max( either, 1 ) ).toFixed( 4 ), onlyMaplibre: onlyA, onlyThree: onlyB };

			};

			// Where MapLibre draws the big square (centred on the anchor) against
			// where map.project puts the anchor: the centroid of the rendered
			// mask, in pixels, and the projected centre
			window.__centroid = async pose => {

				const { transition } = await window.__pose( pose );
				const a = await mask( 'maplibre' );
				const w = canvas.width;
				let n = 0, sx = 0, sy = 0;
				for ( let i = 0; i < a.length; i ++ ) if ( a[ i ] ) {

					n ++; sx += i % w; sy += Math.floor( i / w );

				}

				const p = map.project( [ LNG, LAT ] );
				return { transition, rendered: [ + ( sx / n + 0.5 ).toFixed( 2 ), + ( sy / n + 0.5 ).toFixed( 2 ) ], projected: [ + p.x.toFixed( 2 ), + p.y.toFixed( 2 ) ], pixels: n };

			};

			window.__ready = true;

		</script>
	</body>
</html>
